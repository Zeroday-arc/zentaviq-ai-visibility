name: Diagnose TanStack route compatibility
on:
  push:
    branches:
      - test/vercel-build-repair-20261114
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Baseline type check
        continue-on-error: true
        run: pnpm --filter @workspace/web check-types
      - name: Test TanStack Router matching Start
        run: pnpm --filter @workspace/web add '@tanstack/react-router@latest' '@tanstack/react-start@latest'
      - name: Check types with matched Router
        run: pnpm --filter @workspace/web check-types
      - name: Build with matched Router
        run: pnpm run build
